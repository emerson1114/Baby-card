<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶貝滿月快樂 - 彌月賀卡</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dist/css/lightbox.min.css">
    <script src="dist/js/lightbox-plus-jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #fdf5f2;
            color: #5c4a45;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Scroll Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(to right, #e29578, #ffb5a7);
            width: 0%;
            z-index: 1000;
            transition: width 0.1s ease-out;
        }

        /* Parallax Container */
        .parallax-container {
            position: relative;
            height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            perspective: 10px;
        }

        /* Section Base */
        .section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            z-index: 1;
        }

        /* Background Layers */
        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('./pic/S__40722463.jpg');
            background-position: center;
            /* transform: translateZ(-10px) scale(2); */
            z-index: -1;
            filter: brightness(0.95);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 240, 235, 0.4), rgba(255, 225, 220, 0.6));
            z-index: 0;
        }

        /* Card Content Styles */
        .card-box {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(180, 130, 120, 0.15);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.9);
            transform: translateZ(0px);
            animation: fadeIn 1.5s ease-out;
        }

        .badge {
            display: inline-block;
            background-color: #f4a261;
            color: white;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 50px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(244, 162, 97, 0.3);
        }

        h1 {
            font-size: 1.2rem;
            color: #d87063;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1rem;
            color: #8c736a;
            margin-bottom: 18px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        .message {
            font-size: 1rem;
            line-height: 1.8;
            color: #5c4a45;
            margin-bottom: 35px;
            border-top: 1px dashed #e8c5bc;
            border-bottom: 1px dashed #e8c5bc;
            padding: 16px 0;
        }

        .signature {
            font-size: 0.8rem;
            color: #b05a4a;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Scroll Indicator */
        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            color: #b05a4a;
            font-size: 0.85rem;
            letter-spacing: 2px;
            animation: bounce 2s infinite;
        }

        .scroll-down span {
            display: block;
            font-size: 1.2rem;
            margin-top: 5px;
        }

        /* Second Section for Parallax Depth */
        .section-details {
            position: relative;
            min-height: 100vh;
            background: linear-gradient(to bottom, #fdf5f2, #fae8e2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            z-index: 2;
        }

        .details-card {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(180, 130, 120, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #f0ded8;
        }

        .details-card h2 {
            color: #d87063;
            font-size: 1.8rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .info-grid {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 12px;
        }

        .info-item {
            background: #fdfaf8;
            padding: 14px;
            border-radius: 16px;
            flex: 1;
            border: 1px solid #f4e3df;
        }

        .info-item h3 {
            font-size: 0.9rem;
            color: #8c736a;
            margin-bottom: 8px;
        }

        .info-item p {
            font-size: 1.2rem;
            color: #d87063;
            font-weight: 700;
        }

        .blessing {
            font-size: 1rem;
            line-height: 1.8;
            color: #735d55;
            margin-top: 20px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-10px) translateX(-50%); }
            60% { transform: translateY(-5px) translateX(-50%); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .card-box { padding: 30px 20px; }

        }
#baby_pic{ padding: 8px;  border-radius: 3px;
            box-shadow: 0 5px 5px rgba(180, 130, 120, 0.15);
             background-color:white; margin:auto;  margin-bottom: 2em; display:inline-block;}
        #baby_pic img{max-width: 250px;}
    </style>
</head>
<body>


    <div class="parallax-container" id="parallaxContainer">
        <!-- Section 1: Hero Parallax with Baby Image Background -->
        <section class="section">
            <div class="parallax-bg"></div>
            <div class="overlay"></div>
            
            <div class="card-box">
                <div class="badge">🌸 寶貝滿月喜訊 🌸</div>
                <h1>滿月之喜，感恩相伴</h1>
                <div class="subtitle">Welcome to the world, little angel</div>
                <div class="message">
                    小小的手掌，緊緊握住大大的幸福。<br>
                    感謝您的溫暖祝福與關愛，<br>
                    我們的小寶貝平安滿月啦！<br>
                    願這份喜悅與您一同分享。
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <h4>寶貝小名</h4>
                        <p>玹玹</p>
                    </div>
                    <div class="info-item">
                        <h4>誕生日期</h4>
                        <p>2026.07.19</p>
                    </div>
                </div>
                <div id="baby_pic">
                    <a class="example-image-link" href="./pic/S__40722463.jpg" data-lightbox="example-2" data-title="">
                        <img class="example-image" src="./pic/S__40722463.jpg"" alt="image-1"/>
                    </a>
                </div>
        
                <div class="signature">—— “願你被世界溫柔以待，一生平安喜樂。” ——</div>
            </div>
        </section>


    </div>

</body>
</html>
